

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitySlot - Payout Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Basic Page Setup */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Sidebar Styling (Left Side, Black) */
        .side-drawer {
            height: 100vh; width: 0; position: fixed; z-index: 2000;
            top: 0; left: 0; background-color: #000; overflow-x: hidden;
            transition: 0.5s; padding-top: 3rem;
        }
        .side-drawer a {
            padding: 1rem 2rem; text-decoration: none; font-size: 1rem;
            color: white; display: flex; align-items: center; transition: 0.3s;
            border-bottom: 1px solid #111; text-transform: uppercase;
        }
        .side-drawer a:hover { background-color: #fff; color: #000; }
        .close-btn { color: #666 !important; cursor: pointer; padding: 1rem 2rem; }

        /* Navbar Styling */
        .page-wrapper { background-color: white; border-bottom: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .navbar { padding: 1rem 3%; display: flex; justify-content: space-between; align-items: center; }
        .site-title { font-weight: bold; color: #4F5D95; font-size: 1.2rem; }

        /* Content & Cards Styling */
        .main-content { flex-grow: 1; padding: 2rem 5vw; }
        .payout-card {
            background: white; border-radius: 1rem; border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 2rem;
        }
        .method-card {
            border: 2px solid #eee; border-radius: 0.75rem; padding: 1.5rem;
            cursor: pointer; transition: 0.3s;
        }
        .method-card:hover, .method-card.active { border-color: #4F5D95; background-color: #f8f9ff; }

        /* Submit Button */
        .confirm-btn {
            background-color: #4F5D95; color: white; border-radius: 2rem;
            padding: 0.8rem 3rem; border: none; font-weight: bold; width: 100%;
            transition: 0.3s; margin-top: 1.5rem;
        }
        .confirm-btn:hover { background-color: #3b4675; }
    </style>
</head>
<body>

    <div id="sideDrawer" class="side-drawer">
        <div class="close-btn" onclick="toggleSidebar()">Close Menu ×</div>
        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="spots.html"><i class="fas fa-parking"></i> My Spots</a> 
        <a href="earnings.html"><i class="fas fa-wallet"></i> Earnings</a>
        <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
        <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </div>

    <div class="page-wrapper">
        <nav class="navbar">
            <div onclick="toggleSidebar()" style="font-size: 1.5rem; cursor: pointer; color: #4F5D95;">☰</div>
            <div class="d-flex align-items-center">
                <span class="site-title">CitySlot</span>
                <span style="font-size: 1.5rem; margin-left: 10px;">🚘</span>
            </div>
        </nav>
    </div>

    <main class="main-content">
        <div class="container" style="max-width: 900px;">
            <h2 class="fw-bold mb-4">Request Payout</h2>

            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="payout-card">
                        <h5 class="fw-bold mb-4">Withdrawal Details</h5>
                        <form action="process_payout.php" method="POST">
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold text-muted small">WITHDRAW AMOUNT</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">$</span>
                                    <input type="number" name="amount" class="form-control border-start-0" placeholder="0.00" required>
                                </div>
                                <div class="mt-2 p-2 bg-light rounded border-start border-success border-4">
                                    <small class="text-muted">Available Balance: </small>
                                    <span class="fw-bold text-success">$0.00</span>
                                </div>
                            </div>

                            <label class="form-label fw-bold text-muted small mb-3">SELECT PAYMENT METHOD</label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="method-card text-center" onclick="selectMethod(this)">
                                        <i class="fas fa-university fa-lg mb-2" style="color: #4F5D95;"></i>
                                        <div class="fw-bold">Bank Transfer</div>
                                        <small class="text-muted">3-5 Days</small>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="method-card text-center" onclick="selectMethod(this)">
                                        <i class="fas fa-mobile-alt fa-lg mb-2" style="color: #4F5D95;"></i>
                                        <div class="fw-bold">Vodafone Cash</div>
                                        <small class="text-muted">Instant</small>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                                <label class="form-label fw-bold text-muted small">ACCOUNT OR WALLET NUMBER</label>
                                <input type="text" name="account_info" class="form-control" placeholder="Enter number or IBAN" required>
                            </div>

                            <button type="submit" class="confirm-btn shadow">Confirm Withdrawal</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="payout-card" style="background-color: #4F5D95; color: white;">
                        <h6 class="fw-bold mb-3"><i class="fas fa-info-circle me-2"></i> Important</h6>
                        <ul class="small ps-3" style="opacity: 0.9; line-height: 1.8;">
                            <li>Minimum withdrawal is $10.00.</li>
                            <li>Processed on Sun & Thu.</li>
                            <li>Double check your info before submitting.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Function to open/close the sidebar
        function toggleSidebar() {
            const drawer = document.getElementById("sideDrawer");
            drawer.style.width = (drawer.style.width === "260px") ? "0" : "260px";
        }

        // Function to highlight the selected payment method
        function selectMethod(element) {
            document.querySelectorAll('.method-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
