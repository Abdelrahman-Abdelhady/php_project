<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CitySlot - Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 5px solid #4F5D95;
        }

        .btn-primary {
            background: #4F5D95;
            border: none;
            border-radius: 25px;
            padding: 10px;
            width: 100%;
        }

        .btn-primary:hover {
            background: #3b4675;
        }

        .role-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-selection input {
            display: none;
        }

        .role-selection label {
            flex: 1;
            text-align: center;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .role-selection input:checked + label {
            background: #4F5D95;
            color: white;
            border-color: #4F5D95;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: #4F5D95;">CitySlot 🚘</h2>
        <p class="text-muted">Create your account</p>
    </div>

    <form action="login.html" method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <label class="form-label">I am a:</label>

        <div class="role-selection">

            <input type="radio" name="role" id="driver" value="driver" checked>
            <label for="driver">Driver</label>

            <input type="radio" name="role" id="owner" value="owner">
            <label for="owner">Owner</label>

        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary shadow">
            Sign Up
        </button>

    </form>

    <div class="mt-4 text-center">
        <p class="small text-muted">
            Already have an account?

            <a href="login.html"
               class="text-decoration-none fw-bold"
               style="color: #4F5D95;">
                Login
            </a>
        </p>
    </div>

</div>

</body>
</html>
